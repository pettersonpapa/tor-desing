<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Tor - navegacao anonima e resistencia a censura" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25103f"/>
      <stop offset="0.55" stop-color="#5a2d80"/>
      <stop offset="1" stop-color="#7d4698"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="onion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98cd6"/>
      <stop offset="1" stop-color="#7d4698"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="230" cy="180" r="220" fill="url(#glow)"/>

  <!-- Onion -->
  <g transform="translate(230,196)">
    <path d="M0,-118 C-6,-150 -34,-160 -46,-150 C-30,-142 -14,-128 0,-104 Z" fill="#68b030"/>
    <path d="M0,-118 C6,-150 34,-160 46,-150 C30,-142 14,-128 0,-104 Z" fill="#7bc63d"/>
    <ellipse cx="0" cy="0" rx="92" ry="108" fill="url(#onion)"/>
    <ellipse cx="0" cy="0" rx="66" ry="82" fill="none" stroke="#eddcf7" stroke-width="4" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="42" ry="54" fill="none" stroke="#eddcf7" stroke-width="4" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="18" ry="26" fill="#eddcf7" opacity="0.9"/>
  </g>

  <!-- Text -->
  <text x="430" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" letter-spacing="2">Tor</text>
  <text x="435" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e6d3f5">The Onion Router</text>
  <text x="435" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#d9c3ec">Navegação anônima e resistência à censura</text>
  <rect x="435" y="292" width="360" height="4" rx="2" fill="#68b030"/>
</svg>
