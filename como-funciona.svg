<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-label="Como o Tor funciona: trafego roteado por tres nos ate o destino" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f57ad"/>
      <stop offset="1" stop-color="#7d4698"/>
    </linearGradient>
    <clipPath id="round"><rect width="1100" height="360" rx="32"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1100" height="360" fill="#faf7fc"/>
    <rect x="1" y="1" width="1098" height="358" rx="31" fill="none" stroke="#eaddf3" stroke-width="2"/>
    <text x="550" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3a1c56">Como o Tor funciona</text>

    <!-- encrypted path -->
    <line x1="150" y1="190" x2="950" y2="190" stroke="#68b030" stroke-width="5" stroke-dasharray="12 9" stroke-linecap="round"/>

    <!-- USER -->
    <g transform="translate(90,150)">
      <rect x="0" y="0" width="120" height="80" rx="10" fill="#3a1c56"/>
      <rect x="12" y="12" width="96" height="48" rx="4" fill="#c9e8a8"/>
      <rect x="-6" y="80" width="132" height="8" rx="4" fill="#3a1c56"/>
      <text x="60" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#3a1c56">Você</text>
    </g>

    <!-- 3 relay onions -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#3a1c56" text-anchor="middle">
      <g transform="translate(380,190)">
        <ellipse cx="0" cy="0" rx="46" ry="54" fill="url(#node)"/>
        <ellipse cx="0" cy="0" rx="30" ry="36" fill="none" stroke="#eddcf7" stroke-width="3"/>
        <ellipse cx="0" cy="0" rx="14" ry="18" fill="#eddcf7"/>
      </g>
      <text x="380" y="272">Nó de entrada</text>

      <g transform="translate(560,190)">
        <ellipse cx="0" cy="0" rx="46" ry="54" fill="url(#node)"/>
        <ellipse cx="0" cy="0" rx="30" ry="36" fill="none" stroke="#eddcf7" stroke-width="3"/>
        <ellipse cx="0" cy="0" rx="14" ry="18" fill="#eddcf7"/>
      </g>
      <text x="560" y="272">Nó intermediário</text>

      <g transform="translate(740,190)">
        <ellipse cx="0" cy="0" rx="46" ry="54" fill="url(#node)"/>
        <ellipse cx="0" cy="0" rx="30" ry="36" fill="none" stroke="#eddcf7" stroke-width="3"/>
        <ellipse cx="0" cy="0" rx="14" ry="18" fill="#eddcf7"/>
      </g>
      <text x="740" y="272">Nó de saída</text>
    </g>

    <!-- DESTINATION -->
    <g transform="translate(900,150)">
      <rect x="0" y="0" width="120" height="80" rx="10" fill="#68b030"/>
      <circle cx="60" cy="40" r="26" fill="none" stroke="#ffffff" stroke-width="4"/>
      <line x1="34" y1="40" x2="86" y2="40" stroke="#ffffff" stroke-width="4"/>
      <path d="M60,14 C40,30 40,50 60,66 C80,50 80,30 60,14" fill="none" stroke="#ffffff" stroke-width="4"/>
      <text x="60" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#3a1c56">Destino</text>
    </g>

    <text x="550" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b4a86">O tráfego passa por 3 nós aleatórios e criptografados em camadas, como uma cebola.</text>
  </g>
</svg>
